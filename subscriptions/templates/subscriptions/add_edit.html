{% extends 'subscriptions/base.html' %}

{% block content %}
<div class="mb-4">
    <h3>{% if sub %}Редагувати підписку: {{ sub.service_name }}{% else %}Додати нову підписку{% endif %}</h3>
</div>

<div class="saas-card p-5">
    <form method="POST">
        {% csrf_token %}
        <div class="row g-4">

            <div class="col-12 col-md-6">
                <label class="form-label text-muted small">Назва сервісу</label>
                <input type="text" class="form-control" name="service_name" value="{{ sub.service_name|default:'' }}" placeholder="Наприклад: Netflix, Figma" required>
            </div>

            <div class="col-12 col-md-3">
                <label class="form-label text-muted small">Вартість</label>
                <input type="number" step="0.01" class="form-control" name="price" value="{{ sub.price|default:'' }}" placeholder="0.00" required>
            </div>

            <div class="col-12 col-md-3">
                <label class="form-label text-muted small">Валюта</label>
                <select class="form-select" name="currency">
                    <option value="UAH" {% if sub.currency == 'UAH' %}selected{% endif %}>UAH (₴)</option>
                    <option value="USD" {% if sub.currency == 'USD' %}selected{% endif %}>USD ($)</option>
                    <option value="EUR" {% if sub.currency == 'EUR' %}selected{% endif %}>EUR (€)</option>
                </select>
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label text-muted small">Опис (необов'язково)</label>
                <textarea class="form-control" name="description" rows="4" placeholder="Для чого ця підписка або який тарифний план...">{{ sub.description|default:'' }}</textarea>
            </div>

            <div class="col-12 col-md-6">
                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label text-muted small">Категорія</label>
                        <select class="form-select" name="category">
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if sub.category.id == cat.id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% empty %}
                                <option value="">Немає доступних категорій</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small">Дата наступного платежу</label>
                        <input type="date" class="form-control" name="next_payment" value="{{ sub.next_payment|date:'Y-m-d' }}" required>
                    </div>
                </div>
            </div>

            <div class="col-12 mt-5 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn btn-primary-saas">Зберегти підписку</button>
                <a href="{% url 'subscriptions:list' %}" class="btn btn-light text-dark fw-bold border px-4">Скасувати</a>
            </div>

        </div>
    </form>
</div>
{% endblock %}
