{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - SubTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'subscriptions/css/style.css' %}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="saas-card auth-card p-0">
            <div class="auth-header">
                <h4 class="mb-0">Створити обліковий запис</h4>
            </div>

            <div class="p-4">
                <h5 class="text-center mb-4">Реєстрація</h5>
                {% if error %}
    <div class="alert alert-danger py-2 small text-center rounded-3 mb-3" role="alert">
        {{ error }}
    </div>
{% endif %}
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input type="text" class="form-control" name="username" placeholder="Ім'я користувача" required>
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control" name="email" placeholder="Email" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control" name="password" placeholder="Пароль" required>
                    </div>

                    <div class="mb-4">
                        <input type="password" class="form-control" name="password_confirm" placeholder="Підтвердження пароля" required>
                    </div>

                    <button type="submit" class="btn btn-primary-saas w-100 mb-2">Зареєструватися</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="small text-muted">Вже маєте акаунт? </span>
                    <a href="{% url 'subscriptions:login' %}" class="small text-dark fw-bold text-decoration-none">Увійти</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
