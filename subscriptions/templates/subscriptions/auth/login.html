{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - SubTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'subscriptions/css/style.css' %}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="saas-card auth-card p-0">
            <div class="auth-header">
                <h4 class="mb-0">Увійти в систему</h4>
            </div>

            <div class="p-4">
                {% if error %}
    <div class="alert alert-danger py-2 small text-center rounded-3 mb-3" role="alert">
        {{ error }}
    </div>
{% endif %}
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label text-muted small">Email або ім'я користувача</label>
                        <input type="text" class="form-control" name="username" placeholder="Введіть логін" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small">Пароль</label>
                        <input type="password" class="form-control" name="password" placeholder="Введіть пароль" required>
                    </div>

                    <button type="submit" class="btn btn-primary-saas w-100 mb-3">Увійти</button>

                    <div class="text-center">
                        <a href="#" class="text-muted text-decoration-none small">Забули пароль?</a>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="small text-muted">Ще немає акаунта? </span>
                    <a href="{% url 'subscriptions:register' %}" class="small text-dark fw-bold text-decoration-none">Зареєструватися</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
